name: Dados · garimpo (Amazon Mining Watch)

on:
  schedule:
    - cron: "30 6 * * 1"    # semanal (segunda-feira)
  push:
    branches: [main]
    paths: ["pipeline/mining.py", "pipeline/common.py"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SENTRY_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: scripts/data-branch.sh checkout
      - working-directory: pipeline
        run: python mining.py
      - run: scripts/data-branch.sh publish "garimpo $(date -u +%FT%TZ)"

  deploy:
    needs: update
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Baixar dados (branch data)
        run: scripts/data-branch.sh checkout
      - name: Montar site
        run: |
          mkdir -p _site
          cp -a site/. _site/
          mkdir -p _site/data
          # dados gerados (sem o cache interno do pipeline)
          rsync -a --exclude '.git' --exclude '_cache' --exclude 'README.md' data/ _site/data/
          du -sh _site _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
