name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Baixar dados (branch data)
        run: scripts/data-branch.sh checkout
      - name: Montar site
        run: |
          mkdir -p _site
          cp -a site/. _site/
          mkdir -p _site/data
          # dados gerados (sem o cache interno do pipeline)
          rsync -a --exclude '.git' --exclude '_cache' --exclude 'README.md' --exclude 'fires' data/ _site/data/
          du -sh _site _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # o GitHub às vezes falha ao achar o pacote recém-enviado; tenta de novo
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
