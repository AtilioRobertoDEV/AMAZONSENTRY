name: Treino · modelo de pistas

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Etapas (fetch, features ou fetch,features)"
        required: false
        default: "fetch,features"

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      SENTRY_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: scripts/data-branch.sh checkout
      - name: Exemplos do OSM
        if: contains(inputs.steps, 'fetch')
        working-directory: pipeline
        run: python -u airstrip_model.py fetch
      - name: Medidas no Sentinel-2
        if: contains(inputs.steps, 'features')
        working-directory: pipeline
        run: python -u airstrip_model.py features --workers 24 --budget 120
      - run: scripts/data-branch.sh publish "treino pistas $(date -u +%FT%TZ)"
