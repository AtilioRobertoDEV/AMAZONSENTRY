name: Dados · fiscalização (Ibama)

on:
  push:
    branches: [main]
    paths: ["pipeline/enforcement.py", ".github/workflows/data-enforcement.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SENTRY_DATA_DIR: ${{ github.workspace }}/data
      ENF_CACHE: /tmp/enf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: scripts/data-branch.sh checkout
      - working-directory: pipeline
        run: python enforcement.py
      - run: ls -la data/enforcement
      - run: scripts/data-branch.sh publish "fiscalização $(date -u +%FT%TZ)"
