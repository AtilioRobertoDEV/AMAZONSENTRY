name: Dados · desmatamento (GLAD + Hansen)

on:
  schedule:
    - cron: "45 9 * * *"    # diário, depois da publicação dos alertas GLAD da América do Sul
  push:
    branches: [main]
    paths: ["pipeline/deforestation.py", "pipeline/radar.py", "pipeline/common.py"]
  workflow_dispatch:
    inputs:
      alert_years:
        description: "Anos de alertas GLAD para reprocessar, ex.: 2021 2022 (vazio = ano atual + os que faltam)"
        required: false
        default: ""
      force_loss:
        description: "Reprocessar a perda anual Hansen mesmo sem versão nova"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SENTRY_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: scripts/data-branch.sh checkout
      - name: Alertas GLAD-L
        working-directory: pipeline
        run: |
          if [ -n "${{ inputs.alert_years }}" ]; then
            python deforestation.py alerts --years ${{ inputs.alert_years }}
          else
            python deforestation.py alerts --missing
          fi
      - name: Perda anual Hansen (só quando sai versão nova)
        working-directory: pipeline
        run: python deforestation.py loss ${{ inputs.force_loss && '--force' || '' }}
      - name: Radar IA
        working-directory: pipeline
        run: python radar.py
      - name: Tirar dados de fogo (camada abandonada)
        run: |
          rm -rf data/fires
          python - <<'PY'
          import json, pathlib
          for name in ("manifest.json", "stats.json"):
              p = pathlib.Path("data") / name
              if p.exists():
                  d = json.loads(p.read_text())
                  (d.get("layers") or {}).pop("fires", None)
                  d.pop("fires", None)
                  p.write_text(json.dumps(d, separators=(",", ":"), ensure_ascii=False))
          PY
      - run: scripts/data-branch.sh publish "desmatamento $(date -u +%FT%TZ)"

  deploy:
    needs: update
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Baixar dados (branch data)
        run: scripts/data-branch.sh checkout
      - name: Montar site
        run: |
          mkdir -p _site
          cp -a site/. _site/
          mkdir -p _site/data
          # dados gerados (sem o cache interno do pipeline)
          rsync -a --exclude '.git' --exclude '_cache' --exclude 'README.md' --exclude 'fires' data/ _site/data/
          du -sh _site _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # o GitHub às vezes falha ao achar o pacote recém-enviado; tenta de novo
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
