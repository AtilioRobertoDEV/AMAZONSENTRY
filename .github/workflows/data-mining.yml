name: Dados · garimpo (Amazon Mining Watch)

on:
  schedule:
    - cron: "30 6 * * 1"    # semanal (segunda-feira)
  push:
    branches: [main]
    paths: ["pipeline/mining.py", "pipeline/common.py"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SENTRY_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: scripts/data-branch.sh checkout
      - working-directory: pipeline
        run: python mining.py
      - run: scripts/data-branch.sh publish "garimpo: $(date -u +%FT%TZ)"

  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
