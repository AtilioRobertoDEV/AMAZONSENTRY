name: Teste do pipeline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SENTRY_DATA_DIR: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Sintaxe
        run: python -m py_compile pipeline/*.py && node --check site/app.js
      - name: Garimpo (Amazon Mining Watch)
        working-directory: pipeline
        run: python mining.py
      - name: Resumo
        run: |
          find out -type f -printf '%10s  %p\n' | sort -k2
          python -c "import json;print(json.dumps(json.load(open('out/manifest.json')),indent=1));print(json.dumps(json.load(open('out/stats.json')),indent=1))"
